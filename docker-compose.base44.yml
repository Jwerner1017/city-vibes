services:
  web:
    image: node:22-slim
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:8080"
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
      # Vite >= 6.1 appends this to its allowed hosts so the preview proxy is accepted.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=.${BASE44_SANDBOX_HOST_DOMAIN}
    volumes:
      - .:/app
      # Keep installed dependencies container-local so host node_modules never shadows them.
      - web_node_modules:/app/node_modules
    command: ["sh", "-ec", "npm ci && exec npm run dev"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  web_node_modules:
