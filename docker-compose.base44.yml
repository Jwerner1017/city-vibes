services:
  web:
    image: node:22-slim
    working_dir: /workspace
    volumes:
      - .:/workspace
      - web_node_modules:/workspace/node_modules
    ports:
      - "3000:8080"
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: ["sh", "-ec", "npm install && exec npm run dev"]
    restart: on-failure
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  web_node_modules:
